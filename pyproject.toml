[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ccsearch"
version = "0.2.0"
description = "Search your Claude Code sessions in natural language and jump back into them"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "model2vec>=0.4", "huggingface_hub>=0.20"]
keywords = ["claude-code", "search", "cli", "bm25", "embeddings"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]

[project.optional-dependencies]
hydradb = ["httpx>=0.27"]
fast = ["orjson>=3.9"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
ccs = "ccsearch:main"

[project.urls]
Homepage = "https://github.com/gun29may/ccsearch"

[tool.setuptools]
py-modules = ["ccsearch", "ccs_hydra"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# explicit, so newer ruff releases with broader defaults give the same result
select = ["E4", "E7", "E9", "F"]  # ruff's classic default

[tool.pytest.ini_options]
testpaths = ["tests"]
