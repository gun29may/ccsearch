name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[hydradb,dev]"
      - name: SQLite version (FTS5 contentless_delete needs 3.43+)
        run: python -c "import sqlite3; print(sqlite3.sqlite_version)"
      - run: ruff check .
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-potion-retrieval-32M
      - run: pytest -q
